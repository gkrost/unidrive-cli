# Build-wide Gradle settings. Per-machine overrides belong in ~/.gradle/gradle.properties, not here.

# The configuration cache is not used by this build. Saying so explicitly also silences the
# "Consider enabling configuration cache" tip that every run printed.
org.gradle.configuration-cache=false

# The HTML problems report is incubating; its "Problems report is available at ..." line ended every run.
org.gradle.problems.report=false

# Run the tasks of independent modules in parallel. `./gradlew check` ran one module after the other: measured on a 12-core machine, the full
# check took 12.5 minutes serial and 7.6 minutes parallel, green both times. CI runners have fewer cores, so the gain there is smaller.
org.gradle.parallel=true
# Workers are not capped here. A cap of 2 tuned the build for hosted CI runners' four cores, where
# timing-sensitive tests would otherwise be starved by several test JVMs running beside compilers and other
# test tasks, but it slowed every developer machine (a clean testClasses measured 10 m 43 s with 2 workers
# against 5 m 27 s with 6 on a 12-core machine). CI carries the cap in the workflows' GRADLE_OPTS instead
# (build.yml, release.yml, nightly.yml); developer machines keep Gradle's default of one worker per core.

# The build cache is on: a fresh worktree at the same or a nearby commit takes most compile tasks FROM-CACHE
# instead of recompiling all 13 modules (measured 1 m 52 s cached against 5 m 27 s uncached for a clean
# testClasses at one commit). Cache keys are relative-path stable across worktrees; the entries live in
# ~/.gradle/caches/build-cache-1 and Gradle's own retention cleans them. Test tasks are never cached
# (core/build.gradle.kts), so every run still executes its tests.
org.gradle.caching=true

# The Kotlin Gradle plugin's build-finish statistics service (FUS) wrote a file into ~/.gradle/kotlin-profile
# at the end of every invocation and spent 60-100 s there on a machine that builds from the command line
# (`./gradlew help`: 79 s with it, under 3 s without), and nothing cleans that folder up unless an IDE uploads
# it. CI environments skip FUS on their own, so this changes nothing there. Internal property of
# kotlin-gradle-plugin: the build prints one "Usage of Internal Kotlin Gradle Plugin Properties Detected"
# warning per run, and the name must be rechecked on Kotlin upgrades (KOTLIN_COLLECT_FUS_METRICS_ENABLED).
kotlin.internal.collectFUSMetrics=false

# Heap for the Gradle daemon and the Kotlin compiler daemon. Without these both run on their small defaults, and CI
# compiles failed with "OutOfMemoryError: Java heap space / GC overhead limit exceeded" in the Kotlin compiler
# (2026-10-05, PR branches of archive#570 and archive#572). GitHub's hosted runners have 16 GB; a developer machine overrides in
# ~/.gradle/gradle.properties if it needs less.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g

# Dependency verification (gradle/verification-metadata.xml, sha256 of every dependency and plugin artifact): lenient
# by default, so a mismatch or a missing entry is reported as a warning and does not fail the build. The release
# workflow runs with --dependency-verification strict, so the signed jar is only built from artifacts that match.
# Lenient elsewhere: an IDE sync fetches sources jars that are not listed, and a PR's first commit of a dependency change
# does not carry its metadata yet. A Dependabot Gradle PR gets it from the workflow
# .github/workflows/dependabot-verification-metadata.yml, which commits the regenerated file to the PR branch; after a
# dependency change of your own regenerate it with the same command
#   GRADLE_USER_HOME=<empty dir> ./gradlew --write-verification-metadata sha256 help check -x test :app:cli:shadowJar :app:cli:cyclonedxDirectBom
# and review the diff. The empty Gradle user home matters: a warm cache skips parent POMs and BOMs it has already
# parsed, and the Plugin Portal serves its own plugin marker POMs, which differ from the Central copies (both are listed). Check a build locally the way the release does with --dependency-verification strict.
org.gradle.dependency.verification=lenient

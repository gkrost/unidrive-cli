name: dependabot verification metadata

# A Dependabot Gradle PR bumps versions and lockfiles but not core/gradle/verification-metadata.xml, and the release
# builds with --dependency-verification strict (release.yml), so an unrecorded artifact would only fail the tag. This
# workflow regenerates the metadata the way core/gradle.properties describes (empty Gradle user home, the release
# tasks included) and commits it to the Dependabot branch when it changed. The owner reviews that diff with the bump.
#
# Two jobs, so the job that runs the PR's build never holds a write token: `regenerate` runs Gradle with a read-only
# token and hands over the one file as an artifact; `commit` runs no build, copies only that file and pushes.
#
# A push made with the workflow token starts the PR's `build` runs in an approval-required state (GitHub's rule
# against recursive runs): the required checks `check` and `windows-security` run on the new head once the owner
# selects "Approve workflows to run" on the PR. This workflow's own run of that push skips both jobs (the actor is
# not Dependabot). After the bot commit Dependabot no longer rebases the PR by itself; `@dependabot rebase` drops the
# commit and this workflow adds it again.
on:
  pull_request:
    paths:
      - 'core/*.lockfile'
      - 'core/**/*.lockfile'
      - 'core/*.gradle.kts'
      - 'core/**/*.gradle.kts'
      - 'core/gradle/libs.versions.toml'
      - 'core/gradle/wrapper/gradle-wrapper.properties'

permissions:
  contents: read

concurrency:
  group: dependabot-verification-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/gradle/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No setup-gradle cache: the metadata must be written from an empty Gradle user home (a warm cache skips parent
      # POMs and BOMs it has already parsed, see core/gradle.properties). The wrapper is still validated.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Regenerate verification metadata
        working-directory: core
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
        run: ./gradlew --no-daemon --write-verification-metadata sha256 help check -x test :app:cli:shadowJar :app:cli:cyclonedxDirectBom

      - name: Compare with the committed metadata
        id: diff
        run: |
          set -euo pipefail
          # The build writes nothing else that git tracks; if it did, that change is not what this job hands over.
          git status --porcelain
          if git diff --quiet -- core/gradle/verification-metadata.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The committed verification metadata already covers this PR." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo '### Regenerated verification metadata'
              echo '```diff'
              git diff -- core/gradle/verification-metadata.xml
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Hand over the metadata
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: core/gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-metadata
          path: ${{ runner.temp }}/verification-metadata

      - name: Commit the metadata to the Dependabot branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REGENERATED_FROM: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Dependabot pushed again meanwhile: the metadata belongs to an older head, and the new push has a run of its own.
          if [ "$(git rev-parse HEAD)" != "$REGENERATED_FROM" ]; then
            echo "The branch moved past $REGENERATED_FROM; nothing committed."
            exit 0
          fi
          cp "$RUNNER_TEMP/verification-metadata/verification-metadata.xml" core/gradle/verification-metadata.xml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(deps): regenerate the dependency verification metadata" -- core/gradle/verification-metadata.xml
          git push origin "HEAD:refs/heads/$HEAD_REF"

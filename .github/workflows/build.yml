name: build

on:
  push:
    branches: [main]
  pull_request:
  # A manual run builds in full, the legs a pull request skips included (see the `changes` job).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# gkrost/unidrive-cli#458: Gradle retries a dependency download that fails transiently (a 429 from Maven Central
# included) only 3 times, 1 s apart and doubling: a rate limit outlasts that, and a job went red after 13 s. In CI each
# module resolution gets 5 tries with 5 s doubling (at most 5 + 10 + 20 + 40 s of waiting). Gradle reads these two
# internal properties in ErrorHandlingModuleComponentRepository (9.8.1); GRADLE_OPTS carries them into the build JVM,
# the single-use one of --no-daemon included. Developer machines keep Gradle's defaults. Which repositories and mirrors
# serve the build is #183, and is not changed here.
#
# gkrost/unidrive-cli#596: the local build cache is on in CI (org.gradle.caching). setup-gradle saves ~/.gradle/caches,
# build-cache-1 included, from jobs on main and restores it read-only on pull requests, so a pull request compiles only
# the modules it changes and the ones that depend on them. Test tasks are never cached (core/build.gradle.kts): every
# job still runs its whole test set. Developer machines keep the cache off unless they turn it on themselves.
env:
  GRADLE_OPTS: -Dorg.gradle.internal.repository.max.tentatives=5 -Dorg.gradle.internal.repository.initial.backoff=5000 -Dorg.gradle.caching=true

# Every Ubuntu job pins ubuntu-24.04: the ubuntu-latest label began migrating to
# Ubuntu 26 on 2026-10-19, and an uncontrolled image flip is exactly what this
# build does not want — the ignore-oracle's drift leg (git 2.43.0) is "the git
# of Ubuntu 24.04", and the gate's timing-sensitive tests are tuned for this
# image's four cores (org.gradle.workers.max in core/gradle.properties). Moving
# to Ubuntu 26 is a deliberate platform bump, not something a label does
# overnight: pair it with re-deriving the oracle's drift leg and re-measuring
# the workers cap.
jobs:
  # Advisory secret scan. gitleaks-action scans the event's commit range (push
  # or pull request), not the full history; the full checkout is what makes the
  # range resolvable. The required gates are `check` and
  # `windows-security` (repository ruleset); this job reports findings without becoming a required check.
  gitleaks:
    name: gitleaks (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: 8.28.0

  # Advisory Kotlin SAST. The custom rules in .semgrep.yml and .semgrep/rules/
  # were run by no workflow before this job existed. Advisory like gitleaks and
  # CodeQL: continue-on-error, and never a required merge check — `check` (and
  # `windows-security`) stay the only gates. Findings appear in the job log.
  semgrep:
    name: semgrep (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Unpinned on purpose: the job gates nothing, so a semgrep release or a
      # new rule cannot break a merge.
      - name: Install semgrep
        run: pipx install semgrep

      - name: Semgrep scan
        run: semgrep scan --config .semgrep.yml --config .semgrep/rules --metrics=off

  # Docs-only changes (Markdown and docs/) must not start a Gradle build. `check` is a REQUIRED status check (repository
  # ruleset), so the workflow itself cannot be path-filtered: a workflow that never starts leaves the required check
  # pending forever. Instead the heavy jobs are skipped; a skipped job satisfies a required check.
  # A docs file that a test reads is code (archive#1075): a PR that edits only it must run that test, or main goes red after
  # the merge. `docs_read_by_tests` below names them (today SyncConfigScopeTest reads docs/config-schema/config.schema.json;
  # the whole folder is listed); a test that starts reading another file under docs/ adds its path there.
  #
  # `full` decides the two second runs of the whole suite, check-windows and check-runtime-jdk (gkrost/unidrive-cli#596).
  # In 74 runs neither caught anything `check` missed except one flaky test, and together they were 42 % of the runner
  # time, with check-windows alone setting an 18-minute wall clock on every pull request. They run on every push to main
  # and on a manual run (`gh workflow run build.yml --ref <branch>`), and on a pull request only when it changes the build
  # itself (a build script, a lockfile, core/gradle/ — dependency bumps included — the wrapper, or this workflow) or carries
  # the `ci:full` label. A label is read from the event, so it takes effect with the next push to the branch; `labeled` is
  # not a trigger on purpose: a label added mid-run would cancel the running gate through the concurrency group.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      full: ${{ steps.filter.outputs.full }}
      runtime_image: ${{ steps.filter.outputs.runtime_image }}
      s3: ${{ steps.filter.outputs.s3 }}
      ignore_oracle: ${{ steps.filter.outputs.ignore_oracle }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          # Anything that is not Markdown or under docs/ is code, and so is a docs file a test reads. Pushes (main) and
          # manual runs always build, in full; if the file list cannot be read, build in full rather than skip.
          if [ "$EVENT" != pull_request ]; then printf 'code=true\nfull=true\nruntime_image=true\ns3=true\nignore_oracle=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          # A rename lists only the new name in `filename`; `previous_filename` is the old one, so moving code under docs/
          # (or to a .md name) still shows the code path.
          if ! files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq ".[] | .filename, (.previous_filename // empty)"); then
            printf 'code=true\nfull=true\nruntime_image=true\ns3=true\nignore_oracle=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          docs_read_by_tests='^docs/config-schema/'
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qvE '(^docs/|\.md$)' || printf '%s\n' "$files" | grep -qE "$docs_read_by_tests"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
            echo "Docs-only change: Gradle jobs skipped."
          fi
          # gkrost/unidrive-cli#596: runtime-image, s3-minio and ignore-oracle run on a pull request only when a path they
          # build or test changes (or the build itself, or the ci:full label); pushes to main and manual runs always run
          # them (the early exit above). Each list is what the job's Gradle task reads:
          #  - runtime-image: the shadow jar of :app:cli (every module of core/), the launcher templates it boots and the
          #    notices bundled into the jar.
          #  - s3-minio: :providers:s3 and :app:core, its only project dependency.
          #  - ignore-oracle: the matcher and tests in :app:sync, its dependencies :app:core and :app:engine-core, and the
          #    pinned-git action that builds the oracle.
          runtime_image_files='^core/|^dist/launcher/|^(LICENSE|NOTICE|THIRD-PARTY-NOTICES[^/]*)$'
          s3_files='^core/providers/s3/|^core/app/core/'
          ignore_oracle_files='^core/app/(sync|core|engine-core)/|^\.github/actions/pinned-git/'
          build_files='(^|/)[^/]*\.gradle\.kts$|^core/gradle\.properties$|^core/[^/]*\.lockfile$|^core/gradle/|^core/gradlew|^\.github/workflows/build\.yml$'
          for leg in runtime_image:"$runtime_image_files" s3:"$s3_files" ignore_oracle:"$ignore_oracle_files"; do
            name=${leg%%:*}; pattern=${leg#*:}
            if [ "$FULL_LABEL" = true ] || printf '%s\n' "$files" | grep -qE "$build_files|$pattern"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
              echo "$name skipped: no path it builds or tests changed."
            fi
          done
          if [ "$FULL_LABEL" = true ]; then
            echo full=true >> "$GITHUB_OUTPUT"
            echo "Label ci:full: check-windows and check-runtime-jdk run."
          elif printf '%s\n' "$files" | grep -qE "$build_files"; then
            echo full=true >> "$GITHUB_OUTPUT"
            echo "The build changes: check-windows and check-runtime-jdk run."
          else
            echo full=false >> "$GITHUB_OUTPUT"
            echo "check-windows and check-runtime-jdk skipped (main runs them; label ci:full or a manual run brings them to a PR)."
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cache ~/.gradle so runs do not re-download dependencies — repeated
      # fresh downloads from the shared CI egress IPs are what draw Maven
      # Central's 429s (see core/settings.gradle.kts for the mirror set).
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle check
        working-directory: core
        run: ./gradlew check --no-daemon

      # gkrost/unidrive-cli#419: a stable test that fails here left only its console line; the stack went to the
      # report, which nothing uploaded. Uploaded on failure only.
      - name: Upload test reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-linux
          path: |
            core/app/*/build/reports/tests/test
            core/app/*/build/test-results/test
            core/providers/*/build/reports/tests/test
            core/providers/*/build/test-results/test
          if-no-files-found: ignore
          retention-days: 14

      # Advisory: the quarantined (flaky) tests, which `check` does not run (docs/dev/testing-flaky-policy.md). The step
      # cannot fail the job: continue-on-error, a time box, and flakyTest itself ignores their failures. What happened
      # goes to the job summary, one ::warning:: per failed test, and the artifact below.
      - name: Flaky tests (advisory)
        id: flaky
        working-directory: core
        continue-on-error: true
        timeout-minutes: 15
        run: ./gradlew flakyTest --continue --no-daemon

      - name: Upload flaky test reports
        if: ${{ !cancelled() && steps.flaky.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-test-reports-linux
          path: |
            core/app/*/build/reports/tests/flakyTest
            core/app/*/build/test-results/flakyTest
            core/providers/*/build/reports/tests/flakyTest
            core/providers/*/build/test-results/flakyTest
          if-no-files-found: ignore
          retention-days: 14

      # The build checks the quarantine markers; whether the issue behind one is still open it cannot see. Advisory.
      - name: Quarantine issues are open (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # core/build/flaky/quarantine.tsv comes from checkFlakyQuarantine: issue, module, class, test, location
          [ -f core/build/flaky/quarantine.tsv ] || exit 0
          cut -f1 core/build/flaky/quarantine.tsv | sort -un | while read -r n; do
            state=$(gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || echo unknown)
            if [ "$state" != OPEN ]; then
              echo "::warning title=Quarantine issue not open::Issue #$n is $state but tests are still quarantined under it. Un-quarantine them (docs/dev/testing-flaky-policy.md) or reopen the issue."
            fi
          done

  # The packaged distribution ships a jlink runtime image jlinked from the
  # bundled runtime JDK — the current JDK release train, not the compile
  # toolchain (see :app:cli:runtimeImage). This leg runs the gate with the
  # engine and its tests executing on that runtime JDK (-PunidriveTestJvm
  # switches only the test JVMs; bytecode stays at the toolchain level), so
  # a runtime regression surfaces here and not in a packaged build. Gradle
  # itself runs on the runtime JDK; the compile toolchain resolves from the
  # runner's pre-installed JDK. On a pull request only when `changes` says
  # `full` (a build change or the ci:full label); main and manual runs always.
  check-runtime-jdk:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cache ~/.gradle (see the comment in the check job).
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up runtime JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '27'

      - name: Gradle check (runtime JDK)
        working-directory: core
        run: ./gradlew check --no-daemon -PunidriveTestJvm=27

      # gkrost/unidrive-cli#419: a stable test that fails here left only its console line; the stack went to the
      # report, which nothing uploaded. Uploaded on failure only.
      - name: Upload test reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-runtime-jdk
          path: |
            core/app/*/build/reports/tests/test
            core/app/*/build/test-results/test
            core/providers/*/build/reports/tests/test
            core/providers/*/build/test-results/test
          if-no-files-found: ignore
          retention-days: 14

      # Advisory: the quarantined (flaky) tests, which `check` does not run (docs/dev/testing-flaky-policy.md). The step
      # cannot fail the job: continue-on-error, a time box, and flakyTest itself ignores their failures. What happened
      # goes to the job summary, one ::warning:: per failed test, and the artifact below.
      - name: Flaky tests (advisory)
        id: flaky
        working-directory: core
        continue-on-error: true
        timeout-minutes: 15
        run: ./gradlew flakyTest --continue --no-daemon -PunidriveTestJvm=27

      - name: Upload flaky test reports
        if: ${{ !cancelled() && steps.flaky.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-test-reports-runtime-jdk
          path: |
            core/app/*/build/reports/tests/flakyTest
            core/app/*/build/test-results/flakyTest
            core/providers/*/build/reports/tests/flakyTest
            core/providers/*/build/test-results/flakyTest
          if-no-files-found: ignore
          retention-days: 14

  # Builds the packaged distribution's jlink runtime image (:app:cli:runtimeImage) and boots the
  # packaged launcher once against it, on the platforms a package ships for — Linux and Windows.
  # The task itself repeats the jdeps module-set guard of RuntimeModulesTest, so a drifted module
  # set fails here before an image ever ships, and the boot fails the job on a nonzero exit.
  # Not a merge gate, like check-runtime-jdk above: `check` and `windows-security` stay the only
  # required checks (repository ruleset).
  runtime-image:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.runtime_image == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cache ~/.gradle (see the comment in the check job).
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The compile toolchain (25) and the runtime toolchain the image is jlinked from (27,
      # the current release train). Gradle itself ends up on the 27, as in check-runtime-jdk.
      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up runtime JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: '27'

      - name: Build the runtime image
        working-directory: core
        run: ./gradlew :app:cli:runtimeImage --no-daemon

      # Boot the launcher the way a packaged distribution ships it: fat jar and launcher in one
      # directory, rendered from the templates in dist/launcher. On Windows the image sits next to
      # the jar (boot/runtime-image), so the boot exercises the launcher's bundled-runtime leg, and
      # PATH carries no other Java, so a boot that exits 0 ran the image. On Linux the documented
      # UNIDRIVE_JAVA override points at the image.
      - name: Boot the packaged launcher against the image (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          jar=$(ls core/app/cli/build/libs/unidrive-*.jar)
          mkdir -p boot/bin
          cp "$jar" boot/lib.jar
          flags=$(sed 's/#.*//;s/^[[:space:]]*//;s/[[:space:]]*$//' dist/launcher/jvm-flags.txt | grep -v '^$' | sed 's/.*/"&"/' | tr '\n' ' ')
          sed -e "s|@STATIC_FLAGS_SH@|$flags|" \
              -e "s|@JAR@|$PWD/boot/lib.jar|" \
              -e "s|@COROUTINES_DEBUG_AGENT@||" \
              dist/launcher/unidrive.sh.tmpl > boot/bin/unidrive
          chmod +x boot/bin/unidrive
          UNIDRIVE_JAVA="$PWD/core/app/cli/build/runtime-image/bin/java" boot/bin/unidrive --version

      - name: Boot the packaged launcher against the image (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jar = (Get-ChildItem 'core/app/cli/build/libs/unidrive-*.jar' | Select-Object -First 1).FullName
          $boot = Join-Path $PWD 'boot'
          New-Item -ItemType Directory -Force -Path $boot | Out-Null
          Copy-Item $jar (Join-Path $boot (Split-Path -Leaf $jar))
          Copy-Item 'core/app/cli/build/runtime-image' (Join-Path $boot 'runtime-image') -Recurse
          # The same render as the Gradle deploy: flags from jvm-flags.txt, CRLF line endings.
          $flags = Get-Content 'dist/launcher/jvm-flags.txt' | ForEach-Object { ($_ -replace '#.*$', '').Trim() } | Where-Object { $_ }
          $flagLine = '$javaArgs += @(' + (($flags | ForEach-Object { "'$_'" }) -join ', ') + ')'
          $jarBoot = Join-Path $boot (Split-Path -Leaf $jar)
          $text = (Get-Content 'dist/launcher/unidrive.ps1.tmpl' -Raw).Replace("`r`n", "`n").Replace('@STATIC_FLAGS_PS@', $flagLine).Replace('@COROUTINES_DEBUG_AGENT@', '').Replace('@JAR@', $jarBoot)
          [IO.File]::WriteAllText((Join-Path $boot 'unidrive.ps1'), $text.Replace("`n", "`r`n"), [Text.UTF8Encoding]::new($false))
          # No other Java on PATH: the bundled image is the only runtime the launcher can pick.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $boot 'unidrive.ps1') --version
          if ($LASTEXITCODE -ne 0) { throw "the packaged launcher exited $LASTEXITCODE against the bundled runtime image" }

  # The Windows security regression tests, as a job of its own: this job (check name `windows-security`) is a required
  # check, with `check`, in the repository ruleset; the full Windows suite, `check-windows` below, stays advisory
  # (`continue-on-error`). It runs only the classes that guard the owner-only ACLs, the credential stores, the IPC
  # token, the reserved-name quarantine and the Windows file-lock retries; a filter that matches no test fails the job,
  # so a renamed class shows up here instead of silently dropping out. Docs-only PRs skip it, which a required check
  # accepts. A class that joins the list goes into the one Gradle call below, under its module's `test` task.
  windows-security:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Pinned like the ubuntu-24.04 jobs above: windows-latest can flip its
    # image overnight, and this is a required check.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cache ~/.gradle (see the comment in the check job).
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Windows security tests
        working-directory: core
        shell: bash
        run: |
          ./gradlew --continue --no-daemon \
            :app:core:test \
            --tests 'org.krost.unidrive.auth.CredentialStoreTest' \
            --tests 'org.krost.unidrive.io.OwnerOnlyTest' \
            --tests 'org.krost.unidrive.io.OwnerOnlyGrantsTest' \
            --tests 'org.krost.unidrive.io.LocalIoRetryTest' \
            :app:sync:test \
            --tests 'org.krost.unidrive.sync.IpcAuthTest' \
            --tests 'org.krost.unidrive.sync.SyncEngineTest.#230 an invalid-named remote folder is quarantined*' \
            :app:hydration:test \
            --tests 'org.krost.unidrive.hydration.HydrationUploadQueueTest' \
            :providers:internxt:test \
            --tests 'org.krost.unidrive.internxt.WindowsDpapiCredentialProtectorTest' \
            --tests 'org.krost.unidrive.internxt.InternxtUploadWritebackTest'

  # The full suite on Windows, advisory. On a pull request only when `changes` says `full` (a build change or the
  # ci:full label); main and manual runs always. windows-security above stays on every pull request.
  check-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cache ~/.gradle (see the comment in the check job).
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle check (Windows)
        working-directory: core
        shell: bash
        run: ./gradlew check --no-daemon

      # gkrost/unidrive-cli#419: a stable test that fails here left only its console line; the stack went to the
      # report, which nothing uploaded. Uploaded on failure only.
      - name: Upload test reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-windows
          path: |
            core/app/*/build/reports/tests/test
            core/app/*/build/test-results/test
            core/providers/*/build/reports/tests/test
            core/providers/*/build/test-results/test
          if-no-files-found: ignore
          retention-days: 14

      # Advisory: the quarantined (flaky) tests, which `check` does not run (docs/dev/testing-flaky-policy.md). The step
      # cannot fail the job: continue-on-error, a time box, and flakyTest itself ignores their failures. What happened
      # goes to the job summary, one ::warning:: per failed test, and the artifact below.
      - name: Flaky tests (advisory)
        id: flaky
        working-directory: core
        shell: bash
        continue-on-error: true
        timeout-minutes: 15
        run: ./gradlew flakyTest --continue --no-daemon

      - name: Upload flaky test reports
        if: ${{ !cancelled() && steps.flaky.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-test-reports-windows
          path: |
            core/app/*/build/reports/tests/flakyTest
            core/app/*/build/test-results/flakyTest
            core/providers/*/build/reports/tests/flakyTest
            core/providers/*/build/test-results/flakyTest
          if-no-files-found: ignore
          retention-days: 14

  # No macOS job: macOS is not a supported or tested platform yet. The former `check-macos-keychain` job hung until the 6 h
  # job limit on every run (cause not diagnosed) and a macOS leg makes the build too slow. The code
  # and its tests (MacKeychainCredentialProtector) stay in the repo; to bring macOS back, add a `macos-latest` job running
  # `./gradlew :providers:internxt:test --tests '*MacKeychainCredentialProtectorTest'` with a `timeout-minutes` bound.

  # The S3 provider against a real S3 server: MinIO in a Testcontainer (S3MinioContainerTest). Not part of `check`
  # (it needs a Docker engine and pulls an image) and not a required check; Docker is on the Linux runners only.
  s3-minio:
    name: s3-minio
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.s3 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cache ~/.gradle (see the comment in the check job).
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: S3 provider against MinIO
        working-directory: core
        # A runner without Docker fails the job instead of skipping every case.
        env:
          UNIDRIVE_S3_MINIO_REQUIRED: "true"
        run: ./gradlew :providers:s3:minioTest --no-daemon

  # The ignore matcher (org.krost.unidrive.sync.ignore) is checked against `git check-ignore` itself. The oracle
  # is a pinned git built from its release tag, never the runner's git, which moves with the runner image; the
  # other legs of this workflow skip the oracle test (CI set, UNIDRIVE_ORACLE_GIT not).
  #  - 2.55.0 is the reference: zero differences required.
  #  - 2.43.0 (the git of Ubuntu 24.04) is the drift detector: the same corpus on an older git, cases that pin
  #    newer behaviour are skipped by their `min-git` header. A red leg here means git changed semantics.
  ignore-oracle:
    name: ignore-oracle (git ${{ matrix.git }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.ignore_oracle == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: ${{ matrix.informational }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - git: 2.55.0
            commit: e9019fcafe0040228b8631c30f97ae1adb61bcdc
            informational: false
          - git: 2.43.0
            commit: 564d0252ca632e0264ed670534a51d18a689ef5d
            informational: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pinned git
        uses: ./.github/actions/pinned-git
        with:
          version: ${{ matrix.git }}
          commit: ${{ matrix.commit }}

      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Ignore matcher oracle
        working-directory: core
        run: ./gradlew :app:sync:test --tests 'org.krost.unidrive.sync.ignore.*' --no-daemon

      # Runs in core, which always exists: when the build never ran (a dependency download failed, #458) the reports
      # directory is missing, and a working-directory that does not exist fails the step before its fallback can run.
      - name: Oracle and benchmark report
        if: always()
        working-directory: core
        run: |
          reports=app/sync/build/reports
          {
            echo "### Ignore matcher against git ${{ matrix.git }}"
            echo '```'
            cat "$reports/ignore-oracle.txt" "$reports/ignore-benchmark.txt" "$reports/ignore-discovery-benchmark.txt" 2>/dev/null || echo "no report written"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

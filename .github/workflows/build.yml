name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Every Ubuntu job pins ubuntu-24.04: the ubuntu-latest label began migrating to
# Ubuntu 26 on 2026-10-19, and an uncontrolled image flip is exactly what this
# build does not want — the ignore-oracle's drift leg (git 2.43.0) is "the git
# of Ubuntu 24.04", and the gate's timing-sensitive tests are tuned for this
# image's four cores (org.gradle.workers.max in core/gradle.properties). Moving
# to Ubuntu 26 is a deliberate platform bump, not something a label does
# overnight: pair it with re-deriving the oracle's drift leg and re-measuring
# the workers cap.
jobs:
  # Advisory full-history secret scan. The required gates are `check` and
  # `windows-security` (repository ruleset); this job reports findings without becoming a required check.
  gitleaks:
    name: gitleaks (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: 8.28.0

  # Docs-only changes (Markdown and docs/) must not start a Gradle build. `check` is a REQUIRED status check (repository
  # ruleset), so the workflow itself cannot be path-filtered: a workflow that never starts leaves the required check
  # pending forever. Instead the heavy jobs are skipped; a skipped job satisfies a required check.
  # A docs file that a test reads is code (archive#1075): a PR that edits only it must run that test, or main goes red after
  # the merge. `docs_read_by_tests` below names them (today SyncConfigScopeTest reads docs/config-schema/config.schema.json;
  # the whole folder is listed); a test that starts reading another file under docs/ adds its path there.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Anything that is not Markdown or under docs/ is code, and so is a docs file a test reads. Pushes (main) always
          # build; if the file list cannot be read, build rather than skip.
          if [ "$EVENT" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # A rename lists only the new name in `filename`; `previous_filename` is the old one, so moving code under docs/
          # (or to a .md name) still shows the code path.
          if ! files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq ".[] | .filename, (.previous_filename // empty)"); then
            echo code=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          docs_read_by_tests='^docs/config-schema/'
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qvE '(^docs/|\.md$)' || printf '%s\n' "$files" | grep -qE "$docs_read_by_tests"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
            echo "Docs-only change: Gradle jobs skipped."
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cache ~/.gradle so runs do not re-download dependencies — repeated
      # fresh downloads from the shared CI egress IPs are what draw Maven
      # Central's 429s (see core/settings.gradle.kts for the mirror set).
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle check
        working-directory: core
        run: ./gradlew check --no-daemon

      # Advisory: the quarantined (flaky) tests, which `check` does not run (docs/dev/testing-flaky-policy.md). The step
      # cannot fail the job: continue-on-error, a time box, and flakyTest itself ignores their failures. What happened
      # goes to the job summary, one ::warning:: per failed test, and the artifact below.
      - name: Flaky tests (advisory)
        id: flaky
        working-directory: core
        continue-on-error: true
        timeout-minutes: 15
        run: ./gradlew flakyTest --continue --no-daemon

      - name: Upload flaky test reports
        if: ${{ !cancelled() && steps.flaky.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-test-reports-linux
          path: |
            core/app/*/build/reports/tests/flakyTest
            core/app/*/build/test-results/flakyTest
            core/providers/*/build/reports/tests/flakyTest
            core/providers/*/build/test-results/flakyTest
          if-no-files-found: ignore
          retention-days: 14

      # The build checks the quarantine markers; whether the issue behind one is still open it cannot see. Advisory.
      - name: Quarantine issues are open (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # core/build/flaky/quarantine.tsv comes from checkFlakyQuarantine: issue, module, class, test, location
          [ -f core/build/flaky/quarantine.tsv ] || exit 0
          cut -f1 core/build/flaky/quarantine.tsv | sort -un | while read -r n; do
            state=$(gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || echo unknown)
            if [ "$state" != OPEN ]; then
              echo "::warning title=Quarantine issue not open::Issue #$n is $state but tests are still quarantined under it. Un-quarantine them (docs/dev/testing-flaky-policy.md) or reopen the issue."
            fi
          done

  # The packaged distribution ships a jlink runtime image jlinked from the
  # bundled runtime JDK — the current JDK release train, not the compile
  # toolchain (see :app:cli:runtimeImage). This leg runs the gate with the
  # engine and its tests executing on that runtime JDK (-PunidriveTestJvm
  # switches only the test JVMs; bytecode stays at the toolchain level), so
  # a runtime regression surfaces here and not in a packaged build. Gradle
  # itself runs on the runtime JDK; the compile toolchain resolves from the
  # runner's pre-installed JDK.
  check-runtime-jdk:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cache ~/.gradle (see the comment in the check job).
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up runtime JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: '27'

      - name: Gradle check (runtime JDK)
        working-directory: core
        run: ./gradlew check --no-daemon -PunidriveTestJvm=27

      # Advisory: the quarantined (flaky) tests, which `check` does not run (docs/dev/testing-flaky-policy.md). The step
      # cannot fail the job: continue-on-error, a time box, and flakyTest itself ignores their failures. What happened
      # goes to the job summary, one ::warning:: per failed test, and the artifact below.
      - name: Flaky tests (advisory)
        id: flaky
        working-directory: core
        continue-on-error: true
        timeout-minutes: 15
        run: ./gradlew flakyTest --continue --no-daemon -PunidriveTestJvm=27

      - name: Upload flaky test reports
        if: ${{ !cancelled() && steps.flaky.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-test-reports-runtime-jdk
          path: |
            core/app/*/build/reports/tests/flakyTest
            core/app/*/build/test-results/flakyTest
            core/providers/*/build/reports/tests/flakyTest
            core/providers/*/build/test-results/flakyTest
          if-no-files-found: ignore
          retention-days: 14

  # The Windows security regression tests, as a job of its own: this job (check name `windows-security`) is a required
  # check, with `check`, in the repository ruleset; the full Windows suite, `check-windows` below, stays advisory
  # (`continue-on-error`). It runs only the classes that guard the owner-only ACLs, the credential stores, the IPC
  # token, the reserved-name quarantine and the Windows file-lock retries; a filter that matches no test fails the job,
  # so a renamed class shows up here instead of silently dropping out. Docs-only PRs skip it, which a required check
  # accepts. A class that joins the list goes into the one Gradle call below, under its module's `test` task.
  windows-security:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cache ~/.gradle (see the comment in the check job).
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Windows security tests
        working-directory: core
        shell: bash
        run: |
          ./gradlew --continue --no-daemon \
            :app:core:test \
            --tests 'org.krost.unidrive.auth.CredentialStoreTest' \
            --tests 'org.krost.unidrive.io.OwnerOnlyTest' \
            --tests 'org.krost.unidrive.io.OwnerOnlyGrantsTest' \
            --tests 'org.krost.unidrive.io.LocalIoRetryTest' \
            :app:sync:test \
            --tests 'org.krost.unidrive.sync.IpcAuthTest' \
            --tests 'org.krost.unidrive.sync.SyncEngineTest.#230 an invalid-named remote folder is quarantined*' \
            :app:hydration:test \
            --tests 'org.krost.unidrive.hydration.HydrationUploadQueueTest' \
            :providers:internxt:test \
            --tests 'org.krost.unidrive.internxt.WindowsDpapiCredentialProtectorTest' \
            --tests 'org.krost.unidrive.internxt.InternxtUploadWritebackTest'

  check-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cache ~/.gradle (see the comment in the check job).
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle check (Windows)
        working-directory: core
        shell: bash
        run: ./gradlew check --no-daemon

      # Advisory: the quarantined (flaky) tests, which `check` does not run (docs/dev/testing-flaky-policy.md). The step
      # cannot fail the job: continue-on-error, a time box, and flakyTest itself ignores their failures. What happened
      # goes to the job summary, one ::warning:: per failed test, and the artifact below.
      - name: Flaky tests (advisory)
        id: flaky
        working-directory: core
        shell: bash
        continue-on-error: true
        timeout-minutes: 15
        run: ./gradlew flakyTest --continue --no-daemon

      - name: Upload flaky test reports
        if: ${{ !cancelled() && steps.flaky.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-test-reports-windows
          path: |
            core/app/*/build/reports/tests/flakyTest
            core/app/*/build/test-results/flakyTest
            core/providers/*/build/reports/tests/flakyTest
            core/providers/*/build/test-results/flakyTest
          if-no-files-found: ignore
          retention-days: 14

  # No macOS job: macOS is not a supported or tested platform yet. The former `check-macos-keychain` job hung until the 6 h
  # job limit on every run (cause not diagnosed) and a macOS leg makes the build too slow. The code
  # and its tests (MacKeychainCredentialProtector) stay in the repo; to bring macOS back, add a `macos-latest` job running
  # `./gradlew :providers:internxt:test --tests '*MacKeychainCredentialProtectorTest'` with a `timeout-minutes` bound.

  # The ignore matcher (org.krost.unidrive.sync.ignore) is checked against `git check-ignore` itself. The oracle
  # is a pinned git built from its release tag, never the runner's git, which moves with the runner image; the
  # other legs of this workflow skip the oracle test (CI set, UNIDRIVE_ORACLE_GIT not).
  #  - 2.55.0 is the reference: zero differences required.
  #  - 2.43.0 (the git of Ubuntu 24.04) is the drift detector: the same corpus on an older git, cases that pin
  #    newer behaviour are skipped by their `min-git` header. A red leg here means git changed semantics.
  ignore-oracle:
    name: ignore-oracle (git ${{ matrix.git }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: ${{ matrix.informational }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - git: 2.55.0
            commit: e9019fcafe0040228b8631c30f97ae1adb61bcdc
            informational: false
          - git: 2.43.0
            commit: 564d0252ca632e0264ed670534a51d18a689ef5d
            informational: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pinned git
        uses: ./.github/actions/pinned-git
        with:
          version: ${{ matrix.git }}
          commit: ${{ matrix.commit }}

      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Ignore matcher oracle
        working-directory: core
        run: ./gradlew :app:sync:test --tests 'org.krost.unidrive.sync.ignore.*' --no-daemon

      - name: Oracle and benchmark report
        if: always()
        working-directory: core/app/sync/build/reports
        run: |
          {
            echo "### Ignore matcher against git ${{ matrix.git }}"
            echo '```'
            cat ignore-oracle.txt ignore-benchmark.txt ignore-discovery-benchmark.txt 2>/dev/null || echo "no report written"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

name: detekt

# Manual only for now: commits land faster than detekt's findings can be worked off, and the job cost runner time on
# every PR and push to main. Run it from the Actions tab (or `gh workflow run detekt.yml --ref <branch>`), or locally
# with `./gradlew detekt` in core/. Back on PRs: restore the push and pull_request triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detekt-${{ github.ref }}
  cancel-in-progress: true

# Advisory static analysis, like gitleaks, semgrep and CodeQL: continue-on-error, and never a
# required merge check — `check` (and `windows-security`) stay the only gates. detekt is off
# `check` (see the detekt block in core/build.gradle.kts); while this workflow is manual-only a new finding shows
# up only when someone runs it. `./gradlew detekt` runs the detekt task in every module.
# Linux only; there is no macOS job (macOS is not a supported or tested platform).
jobs:
  detekt:
    name: detekt (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cache ~/.gradle so runs do not re-download dependencies (see the comment in build.yml's check job).
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: detekt
        working-directory: core
        run: ./gradlew detekt --no-daemon

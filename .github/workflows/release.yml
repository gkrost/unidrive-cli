name: release

# Fires on annotated or lightweight tag push matching v* (e.g. v0.0.1).
# Per the spec, only the distribution repository enforces the strict tag regex
# `^v(\d+\.\d+\.\d+)(-pkg\d+)?$`. On this repo we accept anything starting
# with `v` so a future pre-release scheme can be opted into without
# editing CI.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# The release runs the same `check` as build.yml's gate, on the same four-core
# runner image, so it carries the workers cap too. The cap left
# core/gradle.properties in gkrost/unidrive-cli#726 so developer machines keep
# Gradle's default; the workflows that run the gate keep it here.
env:
  GRADLE_OPTS: -Dorg.gradle.workers.max=2

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never cancel an in-flight release

jobs:
  # Builds and tests the tag with a read-only, non-persisted token: any build
  # plugin, test dependency or test code that runs during `check` cannot read
  # a write token or push anything. Only the publish job below can write.
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the existing BuildInfo.kt generator (which calls
          # `git rev-parse --short HEAD` and `git diff HEAD --numstat`) finds
          # something to work against.
          fetch-depth: 0
          # The checkout token is not needed after checkout: leave nothing for
          # the Gradle build or the tests to pick up.
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      # Cache ~/.gradle (same 429 rationale as build.yml; see
      # core/settings.gradle.kts for the mirror set).
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The gate runs on the tagged commit itself, before anything is built,
      # signed or published. A failing check stops the job here, so an
      # untested tag never yields a signed release.
      #
      # Both Gradle steps run with strict dependency verification: every
      # dependency and plugin artifact must match its sha256 in
      # core/gradle/verification-metadata.xml, whichever mirror served it,
      # or the job stops before the jar is built and signed. Other builds
      # run lenient (core/gradle.properties). Dependabot Gradle PRs get the
      # regenerated metadata from dependabot-verification-metadata.yml. A
      # dependency change that did not update the metadata fails here:
      # regenerate it in core/ as core/gradle.properties describes (empty
      # Gradle user home), review the diff, commit, and tag again.
      - name: Gradle check
        working-directory: core
        run: ./gradlew check --no-daemon --dependency-verification strict

      - name: Build shadowJar and SBOM
        working-directory: core
        run: ./gradlew :app:cli:shadowJar :app:cli:cyclonedxDirectBom --no-daemon -q --dependency-verification strict

      - name: Verify expected JAR filename
        run: |
          set -euo pipefail
          jar="core/app/cli/build/libs/unidrive-${GITHUB_REF_NAME#v}.jar"
          test -f "$jar" || {
            echo "ERROR: expected $jar to exist after shadowJar build" >&2
            ls -la core/app/cli/build/libs/ >&2
            exit 1
          }
          echo "JAR present: $jar"

      - name: Stage release artefacts
        run: |
          set -euo pipefail
          mkdir -p release-staging
          ver="${GITHUB_REF_NAME#v}"
          cp "core/app/cli/build/libs/unidrive-${ver}.jar" release-staging/
          # CycloneDX SBOM of the jar's components (written by :app:cli:cyclonedxDirectBom, named after the project version).
          cp "core/app/cli/build/reports/cyclonedx/unidrive-${ver}.bom.json" release-staging/
          cd release-staging
          sha256sum "unidrive-${ver}.jar" "unidrive-${ver}.bom.json" > "unidrive-${ver}.jar.sha256"
          cat "unidrive-${ver}.jar.sha256"

      - name: Upload release artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-staging
          path: release-staging/
          if-no-files-found: error

  # Signs and publishes the artefacts the build job uploaded. This is the only
  # job with write access; it runs no Gradle, so nothing from the dependency
  # tree executes with the write token. The `release` environment holds the signing
  # access secrets (TS_OAUTH_*, BASTION_DEPLOY_KEY, SIGNER_DEPLOY_KEY, GPG_PUBLIC_KEY,
  # GPG_KEY_FINGERPRINT): scope them to this environment, protected by a required reviewer.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # required to create the GH Release
    environment: release
    steps:
      - name: Download release artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-staging
          path: release-staging

      # The host's SSH is Tailscale-only, so the runner joins the tailnet as tag:ci.
      # The signing key never leaves pkg-signer; this job holds SSH keys and the
      # PUBLIC key only (krost-infra docs/ci-signing-access.md).
      - name: Join the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Check out the signing script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/release
          path: src

      - name: Sign artefacts via pkg-signer
        env:
          BASTION_DEPLOY_KEY: ${{ secrets.BASTION_DEPLOY_KEY }}
          SIGNER_DEPLOY_KEY: ${{ secrets.SIGNER_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          for v in BASTION_DEPLOY_KEY SIGNER_DEPLOY_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "ERROR: secret $v is not set (see krost-infra docs/ci-signing-access.md)." >&2
              exit 1
            fi
          done
          umask 077
          keys=$(mktemp -d)
          trap 'rm -rf "$keys"' EXIT
          printf '%s\n' "$BASTION_DEPLOY_KEY" > "$keys/bastion"
          printf '%s\n' "$SIGNER_DEPLOY_KEY" > "$keys/signer"
          BASTION_SSH_KEY="$keys/bastion" SIGNER_SSH_KEY="$keys/signer" \
            src/scripts/release/sign-via-signer.sh release-staging "${GITHUB_REF_NAME#v}"
          ls -1 release-staging

      # Verify with the public key only; a signature that does not verify fails the release.
      - name: Verify signatures
        env:
          GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          GPG_KEY_FINGERPRINT: ${{ secrets.GPG_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PUBLIC_KEY:-}" ] || [ -z "${GPG_KEY_FINGERPRINT:-}" ]; then
            echo "ERROR: GPG_PUBLIC_KEY and GPG_KEY_FINGERPRINT secrets are required." >&2
            exit 1
          fi
          printf '%s\n' "$GPG_PUBLIC_KEY" | gpg --batch --import
          ver="${GITHUB_REF_NAME#v}"
          cd release-staging
          for f in "unidrive-${ver}.jar" "unidrive-${ver}.jar.sha256"; do
            out=$(gpg --batch --status-fd 1 --verify "$f.asc" "$f" 2>&1)
            # VALIDSIG: field 3 is the signing (sub)key, field 12 the primary key. The pinned
            # fingerprint is the primary key; the signer signs with its subkey.
            echo "$out" | awk -v fpr="${GPG_KEY_FINGERPRINT}" '$2 == "VALIDSIG" && ($3 == fpr || $12 == fpr) { ok = 1 } END { exit !ok }' || {
              echo "$out" >&2
              echo "ERROR: $f.asc is not a valid signature by ${GPG_KEY_FINGERPRINT}" >&2
              exit 1
            }
          done
          echo "signatures verified"

      - name: Create GitHub Release
        # Pinned by SHA like every action here; the trailing comment names the
        # release it resolves to. Dependabot updates both together.
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Release notes are intentionally minimal here. The full RELEASES.md
          # narrative is published by the distribution repository's release workflow (Plan P4)
          # which pulls this JAR + the Rust binary tarballs.
          body: |
            UniDrive CLI ${{ github.ref_name }}

            JVM artefact for the coordinated UniDrive release. Distro packages
            and the canonical end-user tarball are produced by the distribution repository
            and published at https://unidrive.krost.org/install/.

            Verify with:
              gpg --verify unidrive-*.jar.asc unidrive-*.jar
              sha256sum -c unidrive-*.jar.sha256
          files: |
            release-staging/unidrive-*.jar
            release-staging/unidrive-*.bom.json
            release-staging/unidrive-*.jar.sha256
            release-staging/unidrive-*.jar.asc
            release-staging/unidrive-*.jar.sha256.asc
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
